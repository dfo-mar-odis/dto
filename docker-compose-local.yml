services:
  dto-django:
    build:
      context: .
      dockerfile: Dockerfile.dev
    container_name: dto-django
    restart: always
    ports:
      - "8500:8000"
    command: /bin/bash entry-point.sh
    env_file:
      - ./.env.local
    volumes:
      - .:/opt/project
    depends_on:
      dto-postgis:
          condition: service_healthy

  dto-postgis:
    image: postgis/postgis:13-3.4
    container_name: dto-postgis
    restart: always
    env_file:
      - .env.local
    ports:
      - "5432:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready"]
      interval: 1s
      timeout: 10s
      retries: 10
    volumes:
      - pgdata:/var/lib/postgresql/data/

volumes:
  pgdata:
